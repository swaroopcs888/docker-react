sudo: required
services:
  - docker
before_install:
  - docker build -t swaroopcs88/docker-react -f Dockerfile.dev .
script:
  - docker run -e CI=true swaroopcs88/docker-react npm test -- --coverage
after_success:  - docker build -t swaroopcs88/docker-react .
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  - docker push swaroopcs88/docker-react 

